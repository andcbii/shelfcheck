# Weekly update pull requests for pinned versions: npm packages, GitHub
# Actions (pinned by commit SHA) and the Dockerfile's Node base image
# (pinned by digest).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
