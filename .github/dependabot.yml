# Weekly update pull requests for pinned versions: npm packages, GitHub
# Actions (pinned by commit SHA) and the Dockerfile's Node base image
# (pinned by digest).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Node majors are planned work: keep @types/node on the runtime major.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Node majors are planned work; digest and same-major updates still arrive.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
